how:
  eyebrow: Cum funcționează
  title: Trei pași, apoi dispare.
  steps:
    - n: "01"
      h: Alege-ți aplicațiile
      p: >-
        Cele pe care le deschizi fără să te hotărăști. Cei mai mulți încep cu una
        singură și știu exact care e.
    - n: "02"
      h: Scrie-ți motivul
      p: >-
        Un rând, cu vorbele tale. Îl vei reciti exact în momentul în care
        contează, singurul moment în care funcționează.
    - n: "03"
      h: Intră oricum, sau nu
      p: >-
        Există mereu o cale prin. O barieră care te enervează e o barieră pe care
        o dezinstalezi, așa că Clipa nu devine niciodată una.
  why_title: De ce o propoziție și nu un cronometru
  why_p1: >-
    Un cerc care se învârte poate fi privit cu ochii în gol. Îi înveți forma
    într-o zi și de atunci doar îl aștepți să treacă.
  why_p2: >-
    O propoziție neterminată nu poate fi parcursă din priviri. Până nu cade
    ultimul cuvânt nu ai de ce să te agăți, așa că o citești — iar cititul
    propriului motiv e tot mecanismul.
  ring_title: Un cerc
  ring_body: Învățat într-o zi. Poate fi privit fără să fie citit.
  sentence_title: O propoziție
  sentence_body: Nu poate fi înțeleasă până nu s-a terminat.

nots:
  eyebrow: Ce nu face
  title: Nu există cont, pentru că nu există nimic de stocat.
  p1: >-
    Clipa vede ce aplicație a ajuns în față și pentru cât timp. Nu vede niciodată
    ce e înăuntru și nimic din toate astea nu pleacă de pe telefon.
  p2: >-
    Nu există un server în care să te autentifici și nimic pe care cineva să îl
    poată pierde. Datele tale stau în buzunarul tău și nicăieri altundeva.
    Exportă-le oricând vrei sau șterge-le pe toate dintr-o apăsare.
  privacy_link: Citește politica de confidențialitate
  rows:
    - t: Nu blochează aplicații
      b: Fiecare pauză are o cale prin. Frecare, nu zid.
    - t: Nu te face să te simți vinovat
      b: Fără cifre roșii, fără note, fără „ai eșuat azi”.
    - t: Nu numără serii
      b: O serie e doar ceva de pierdut, iar pierderea ei termină obiceiul.
    - t: Nu are cont
      b: Nimic de creat, nimic în care să intri, nicio parolă de uitat.
    - t: Nu trimite nimic nicăieri
      b: Fără analitice implicit. Dacă le pornești, nu duc niciun conținut.
    - t: Nu scoate niciun sunet
      b: Niciodată. Apare în liniște sau deloc.
    - t: Nu îți vinde nimic pe pauză
      b: Fără reclamă fix în momentul în care încerci să iei o decizie.

changed:
  eyebrow: Ce s-a schimbat
  title: Numără dățile în care ai plecat, nu orele pe care le-ai pierdut.
  p1: >-
    Cele mai multe aplicații de timp pe ecran îți dau o cifră făcută ca să te
    simți prost, apoi te lasă cu ea. Asta ține cam o săptămână.
  p2: >-
    Cifra principală a Clipei e cea care a ieșit cum ai vrut tu: deschiderile pe
    care le-ai închis. Timpul per aplicație e acolo dacă îl vrei, stă cuminte
    lângă număr și nu e adunat niciodată într-un verdict.
  card_eyebrow: Săptămâna asta
  card_label: dăți în care ai închis-o
  days: [Lun, Joi, Dum]
  note_title: Nimic de aici nu e o notă
  note_body: Fără serii de rupt, fără calificativ, fără un total care arată ca un eșec.

night:
  eyebrow: După zece
  title: La unu noaptea, un ecran alb nu e un gest neutru.
  p1: >-
    Între 22:00 și 06:00 pauza își schimbă culorile — chihlimbar cald pe
    aproape-negru, fără albastru — și scade luminozitatea ecranului cât timp e
    deasupra. Nu o crește niciodată.
  p2: >-
    Asta e ora pentru care a fost construită aplicația. E și ora la care
    majoritatea aplicațiilor încetează să le mai pese.
  pills:
    - Paletă caldă, fără albastru
    - Luminozitate scăzută, niciodată crescută
    - Niciodată un sunet
  prompt: E 01:14. Așa vrei să ți-o petreci?
  app: Instagram

