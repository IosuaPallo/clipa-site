faq:
  eyebrow: Întrebări
  title: Cele care merită puse.
  intro_before: "Dacă lipsește ceva, "
  intro_link: scrie-ne
  intro_after: ". Citește un om."
  items:
    - q: Chiar funcționează sau e încă o aplicație pe care o voi șterge?
      a: >-
        Funcționează cât timp pauza încă te pune să citești. De asta propoziția e
        cu vorbele tale și de asta mesajele se rotesc — un ecran fix devine tapet
        într-o săptămână. Clipa e câteva secunde de frecare puse exact acolo unde
        stă reflexul; nu e terapie și nu se preface că ar fi.
    - q: Pot să trec de ea?
      a: >-
        Mereu, la fiecare pauză, dintr-o apăsare. E intenționat. O aplicație din
        care nu poți ieși e o aplicație pe care o dezinstalezi într-un moment
        prost, și de atunci nu te mai ajută niciodată.
    - q: Ce poate să vadă Clipa?
      a: >-
        Ce aplicație a ajuns în față și pentru cât timp. Asta e toată lista. Nu
        poate vedea în interiorul unei aplicații — nici mesajele tale, nici ce ai
        derulat, nici la cine te-ai uitat — și nici nu are unde să trimită ceva,
        chiar dacă ar putea.
    - q: Îmi consumă bateria?
      a: >-
        Se oprește complet din a se uita cât timp ecranul tău e stins, adică cea
        mai mare parte a zilei, și nu ține nicio blocare de trezire. Ținta e sub
        un procent pe zi.
    - q: De ce are nevoie de permisiunea de a desena peste alte aplicații?
      a: >-
        Pentru că exact așa apare pauza peste aplicația pe care tocmai ai
        deschis-o. Android o tratează ca pe o permisiune specială și te întreabă
        pe față, ceea ce e corect. Clipa își desenează propriul ecran și nu
        citește niciodată ce e dedesubt.
    - q: Pe ce telefoane merge?
      a: >-
        Android 11 și mai nou. Unele telefoane — Xiaomi și Samsung în special —
        opresc agresiv aplicațiile din fundal, așa că Clipa verifică dacă mai
        funcționează și îți spune cum să rezolvi pe telefonul tău, în loc să
        cedeze în tăcere.

try:
  eyebrow: Încearc-o
  title: Apasă o aplicație. Simte pauza.
  lede: >-
    Ăsta e lucrul real: aceeași apariție cuvânt cu cuvânt, aceeași sincronizare
    limitată, aceleași butoane care apar doar când s-a terminat așteptarea. Pune
    întârzierea la cât ai suporta cu adevărat.
  step1: Alege aplicația în care pierzi timp
  hint1: >-
    În aplicație asta e lista cu ce ai tu cu adevărat pe telefon. Aici, trei
    dintre suspecții obișnuiți.
  step2: Cât să aștepte?
  hint2: Intervalul aplicației. Cinci secunde e valoarea implicită.
  seconds_abbr: s
  table_caption: Sincronizarea pe care o produce această întârziere
  row_words: cuvinte în propoziție
  row_step: interval per cuvânt
  row_end: propoziția se termină
  row_buttons: butoanele apar
  row_hold: pauza — o propoziție terminată, nimic de apăsat
  count: de 7 ori azi
  # The Romanian reason is four words, not six, so the reveal plan differs. A
  # reader without JS must not be shown the English arithmetic.
  defaults:
    words: "4"
    step: 900 ms
    end: 2.95 s
    buttons: 5.00 s
    hold: 2050 ms
  js:
    open: Deschide
    restart: Ia-o de la capăt
    ms: " ms"
    s: " s"
    no_hold: niciuna la această întârziere
    announce: "După DELAY secunde: „PROMPT”. Acum poți alege: nu acum, sau deschide APP."

cta:
  title: O întrebare, înainte să te ia feed-ul.
  body: >-
    Clipa e aproape gata și pleacă spre Google Play. Scrie-mi și îți spun o
    singură dată, în ziua în care apare.
  subject: Anunță-mă când apare Clipa
  button: Anunță-mă când apare
  note: >-
    Fără listă, fără newsletter, fără vreun serviciu la mijloc. Ajunge într-o
    căsuță de e-mail și primește un răspuns.
