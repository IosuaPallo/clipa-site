name: Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pages:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # The failure this repo is actually exposed to. Jekyll renders an unknown
      # placeholder as an EMPTY STRING, so a policy pushed before setup.sh has
      # run goes live reading "Clipa is made by ." and looks entirely
      # intentional. Nothing about the page would look broken.
      - name: Refuse unfilled placeholders
        run: |
          if grep -rn --exclude-dir=.git -E '\{\{ *(DEVELOPER_NAME|CONTACT_EMAIL|EFFECTIVE_DATE) *\}\}' . ; then
            echo "::error::A placeholder is still unfilled. Run site/setup.sh in clipa-app and copy the result here."
            exit 1
          fi
          echo "no unfilled placeholders"

      # Pages deploys on push with no gate of its own, so if the build breaks
      # the site serves stale content or 404s - and a 404 on the privacy URL
      # fails Play review.
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      # Reading the template cannot catch this class of bug, so read the OUTPUT.
      #
      # The headline is one <span> per word, and the separator between them was
      # a literal space inside a Liquid conditional. Correct in the source,
      # gone from the build: the page shipped reading "Afewseconds betweenyouand
      # yourreflex." and stayed that way through two rounds of review, because
      # every review looked at the input. Found by loading the real site.
      #
      # The build already ran above and nobody had ever looked at what it
      # produced. This asserts on the rendered sentence rather than on the
      # markup that is supposed to produce it, so it also catches a dropped
      # word, a doubled one, or a wholesale change nobody meant.
      - name: The headline keeps its spaces
        run: |
          python3 - <<'EOF'
          import html, re, sys

          want = "A few seconds between you and your reflex."
          page = open('_site/index.html', encoding='utf-8').read()

          m = re.search(r'<h1[^>]*class="[^"]*hero__title[^"]*"[^>]*>(.*?)</h1>',
                        page, re.S)
          if not m:
              sys.exit("::error::no hero headline in the built page")

          got = html.unescape(re.sub(r'<[^>]+>', '', m.group(1)))
          got = ' '.join(got.split())

          if got != want:
              print("::error::the built headline is not the written one")
              print("  want: %r" % want)
              print("  got:  %r" % got)
              sys.exit(1)

          print("headline renders as: %s" % got)
          EOF

      # The other way a page goes live half-filled, and the one that slipped
      # past the check above: a page referencing {{ site.contact_email }} while
      # _config.yml still has it empty. Jekyll renders that as nothing, so the
      # sentence "write to {{ site.contact_email }}" publishes as "write to ."
      # No placeholder to grep for, and the legal-page test does not run unless
       # privacy.md or terms.md already exist.
      #
      # Only content pages are checked. The LAYOUT references site.developer in
      # the footer, where empty renders as a blank line rather than a broken
      # sentence - that is allowed while the site is a landing page only.
      # A link preview and a favicon fail silently by their nature: nobody on
      # the team ever sees them, because you only meet them in someone else's
      # chat window or someone else's tab strip. So they get asserted here.
      #
      # og:image especially - a relative one resolves against the SCRAPER's host
      # and the card renders blank, which looks like the scraper's fault.
      - name: The link preview and the icons resolve
        run: |
          python3 - <<'EOF'
          import json, os, re, sys
          from urllib.parse import urlparse

          page = open('_site/index.html', encoding='utf-8').read()
          bad = []

          def meta(attr, key):
              m = re.search(r'<meta %s="%s" content="([^"]*)"' % (attr, key), page)
              return m.group(1) if m else None

          img = meta('property', 'og:image')
          if not img:
              bad.append('og:image is missing')
          elif not img.startswith(('http://', 'https://')):
              bad.append('og:image is not absolute: %r' % img)
          else:
              path = os.path.join('_site', urlparse(img).path.lstrip('/'))
              if not os.path.isfile(path):
                  bad.append('og:image points at %s, which the build did not produce' % path)

          for f in ('favicon.svg', 'favicon.ico', 'apple-touch-icon.png'):
              if not os.path.isfile(os.path.join('_site', f)):
                  bad.append('%s is not in the build' % f)
              if f not in page:
                  bad.append('%s is not linked from the page' % f)

          # Half-rendered JSON-LD is invalid JSON and looks fine on the page.
          m = re.search(r'<script type="application/ld\+json">(.*?)</script>', page, re.S)
          if not m:
              bad.append('no JSON-LD on the home page')
          else:
              try:
                  data = json.loads(m.group(1))
                  # Only ever claim what is true: Clipa is not on Play yet, so a
                  # price or a rating here would be markup for a product nobody
                  # can buy.
                  for k in ('offers', 'aggregateRating', 'review'):
                      if k in data:
                          bad.append('JSON-LD claims %r while the app is unreleased' % k)
              except ValueError as e:
                  bad.append('JSON-LD is not valid JSON: %s' % e)

          if bad:
              for b in bad:
                  print('::error::%s' % b)
              sys.exit(1)
          print('link preview and icons resolve')
          EOF

      - name: No content page may render an empty config value
        run: |
          fail=0
          for key in contact_email developer; do
            if grep -qE "^${key}: *\"\"" _config.yml; then
              hits=$(grep -rl "site\.${key}" --include="*.md" . || true)
              if [ -n "$hits" ]; then
                echo "::error::${key} is empty in _config.yml but used by: $hits"
                fail=1
              fi
            fi
          done
          if [ $fail -eq 0 ]; then echo "no page renders an empty config value"; fi
          exit $fail

      - name: A published legal page must be complete
        run: |
          if [ ! -f privacy.md ] && [ ! -f terms.md ]; then
            echo "holding page only - the legal documents are not published yet"
            exit 0
          fi
          fail=0
          for page in privacy terms delete-my-data; do
            if [ ! -f "_site/$page/index.html" ]; then
              echo "::error::$page did not render"; fail=1
            fi
          done
          # Empty here means the footer and the contact line render blank.
          if grep -qE '^(developer|contact_email): *""' _config.yml; then
            echo "::error::_config.yml still has an empty value while legal pages are published"
            fail=1
          fi
          exit $fail
