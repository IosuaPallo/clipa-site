name: Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pages:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # The failure this repo is actually exposed to. Jekyll renders an unknown
      # placeholder as an EMPTY STRING, so a policy pushed before setup.sh has
      # run goes live reading "Clipa is made by ." and looks entirely
      # intentional. Nothing about the page would look broken.
      - name: Refuse unfilled placeholders
        run: |
          if grep -rn --exclude-dir=.git -E '\{\{ *(DEVELOPER_NAME|CONTACT_EMAIL|EFFECTIVE_DATE) *\}\}' . ; then
            echo "::error::A placeholder is still unfilled. Run site/setup.sh in clipa-app and copy the result here."
            exit 1
          fi
          echo "no unfilled placeholders"

      # Pages deploys on push with no gate of its own, so if the build breaks
      # the site serves stale content or 404s - and a 404 on the privacy URL
      # fails Play review.
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      # Reading the template cannot catch this class of bug, so read the OUTPUT.
      #
      # The headline is one <span> per word, and the separator between them was
      # a literal space inside a Liquid conditional. Correct in the source,
      # gone from the build: the page shipped reading "Afewseconds betweenyouand
      # yourreflex." and stayed that way through two rounds of review, because
      # every review looked at the input. Found by loading the real site.
      #
      # The build already ran above and nobody had ever looked at what it
      # produced. This asserts on the rendered sentence rather than on the
      # markup that is supposed to produce it, so it also catches a dropped
      # word, a doubled one, or a wholesale change nobody meant.
      - name: The headline keeps its spaces
        run: |
          python3 - <<'EOF'
          import html, re, sys

          want = "A few seconds between you and your reflex."
          page = open('_site/index.html', encoding='utf-8').read()

          m = re.search(r'<h1[^>]*class="[^"]*hero__title[^"]*"[^>]*>(.*?)</h1>',
                        page, re.S)
          if not m:
              sys.exit("::error::no hero headline in the built page")

          got = html.unescape(re.sub(r'<[^>]+>', '', m.group(1)))
          got = ' '.join(got.split())

          if got != want:
              print("::error::the built headline is not the written one")
              print("  want: %r" % want)
              print("  got:  %r" % got)
              sys.exit(1)

          print("headline renders as: %s" % got)
          EOF

      # The other way a page goes live half-filled, and the one that slipped
      # past the check above: a page referencing {{ site.contact_email }} while
      # _config.yml still has it empty. Jekyll renders that as nothing, so the
      # sentence "write to {{ site.contact_email }}" publishes as "write to ."
      # No placeholder to grep for, and the legal-page test does not run unless
       # privacy.md or terms.md already exist.
      #
      # Only content pages are checked. The LAYOUT references site.developer in
      # the footer, where empty renders as a blank line rather than a broken
      # sentence - that is allowed while the site is a landing page only.
      # A link preview and a favicon fail silently by their nature: nobody on
      # the team ever sees them, because you only meet them in someone else's
      # chat window or someone else's tab strip. So they get asserted here.
      #
      # og:image especially - a relative one resolves against the SCRAPER's host
      # and the card renders blank, which looks like the scraper's fault.
      - name: The link preview and the icons resolve
        run: |
          python3 - <<'EOF'
          import json, os, re, sys
          from urllib.parse import urlparse

          page = open('_site/index.html', encoding='utf-8').read()
          bad = []

          def meta(attr, key):
              m = re.search(r'<meta %s="%s" content="([^"]*)"' % (attr, key), page)
              return m.group(1) if m else None

          img = meta('property', 'og:image')
          if not img:
              bad.append('og:image is missing')
          elif not img.startswith(('http://', 'https://')):
              bad.append('og:image is not absolute: %r' % img)
          else:
              path = os.path.join('_site', urlparse(img).path.lstrip('/'))
              if not os.path.isfile(path):
                  bad.append('og:image points at %s, which the build did not produce' % path)

          # A stylesheet change can be deployed, correct, and invisible: the
          # asset URL does not change, so a browser holding the old file has
          # nothing to re-fetch. That is not hypothetical - the hero padding fix
          # shipped and the person who reported it still saw the old layout.
          for asset in ('site.css', 'site.js'):
              if ('%s?v=' % asset) not in page:
                  bad.append('%s is linked without a cache-busting version, so a '
                             'returning visitor keeps the old one' % asset)

          # The launch-notice form. It renders only when form_endpoint is set,
          # so its absence is fine - a broken action is not. A form posting to
          # a relative or http URL loses every submission silently, which is
          # the same failure the mailto had and the reason it was replaced.
          form = re.search(r'<form[^>]*data-cta-form[^>]*action="([^"]*)"', page)
          if form and not form.group(1).startswith('https://'):
              bad.append('the CTA form posts to %r, which is not an absolute '
                         'https endpoint' % form.group(1))

          # A store asset, referenced by nothing on the page, so nothing else
          # would notice it going missing.
          if not os.path.isfile('_site/img/icon-512.png'):
              bad.append('img/icon-512.png is missing from the build')

          for f in ('favicon.svg', 'favicon.ico', 'apple-touch-icon.png'):
              if not os.path.isfile(os.path.join('_site', f)):
                  bad.append('%s is not in the build' % f)
              if f not in page:
                  bad.append('%s is not linked from the page' % f)

          # Half-rendered JSON-LD is invalid JSON and looks fine on the page.
          m = re.search(r'<script type="application/ld\+json">(.*?)</script>', page, re.S)
          if not m:
              bad.append('no JSON-LD on the home page')
          else:
              try:
                  data = json.loads(m.group(1))
                  # Only ever claim what is true: Clipa is not on Play yet, so a
                  # price or a rating here would be markup for a product nobody
                  # can buy.
                  for k in ('offers', 'aggregateRating', 'review'):
                      if k in data:
                          bad.append('JSON-LD claims %r while the app is unreleased' % k)
              except ValueError as e:
                  bad.append('JSON-LD is not valid JSON: %s' % e)

          if bad:
              for b in bad:
                  print('::error::%s' % b)
              sys.exit(1)
          print('link preview and icons resolve')
          EOF

      # Contrast is a property of a PAIR, so it cannot be reviewed by looking at
      # a colour. --text-3 shipped at #6E786F, which is the app's own token and
      # looks entirely reasonable on its own; against --bg it was 4.03:1, and it
      # was carrying 24 pieces of 13-15px text including every footer link.
      #
      # Checked at the token level rather than by rendering. That misses a pair
      # nobody listed here, but it catches the regression that actually happens:
      # somebody lightens a token because it looks heavy in isolation.
      - name: Text colours clear their contrast thresholds
        run: |
          python3 - <<'EOF'
          import re, sys

          css = open('assets/site.css', encoding='utf-8').read()
          tok = dict(re.findall(r'--([a-z0-9-]+)\s*:\s*(#[0-9A-Fa-f]{6})\s*;', css))

          def lum(h):
              c = [int(h[i:i + 2], 16) / 255 for i in (1, 3, 5)]
              c = [x / 12.92 if x <= 0.03928 else ((x + 0.055) / 1.055) ** 2.4
                   for x in c]
              return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]

          def ratio(a, b):
              la, lb = lum(a), lum(b)
              return (max(la, lb) + 0.05) / (min(la, lb) + 0.05)

          # (foreground, background, minimum, what it is)
          # 4.5 for body text, 3.0 for large text and for focus indicators.
          PAIRS = [
              ('text',      'bg',      4.5, 'body text'),
              ('text',      'surface', 4.5, 'body text on a card'),
              ('text-2',    'bg',      4.5, 'secondary text'),
              ('text-2',    'surface', 4.5, 'secondary text on a card'),
              ('text-3',    'bg',      4.5, 'tertiary text, 13-15px everywhere'),
              ('text-3',    'surface', 4.5, 'tertiary text on a card'),
              ('accent',    'bg',      3.0, 'the focus ring'),
              ('accent',    'surface', 3.0, 'the focus ring on a card'),
              ('ink-050',   'text',    4.5, 'the CTA title'),
              ('ink-200',   'text',    4.5, 'the CTA body'),
              ('ink-350',   'text',    4.5, 'the CTA note'),
              ('green-400', 'text',    3.0, 'the focus ring on the dark card'),
          ]

          bad = 0
          for fg, bg, need, what in PAIRS:
              if fg not in tok or bg not in tok:
                  print('::error::site.css no longer defines --%s or --%s'
                        % (fg, bg))
                  bad = 1
                  continue
              r = ratio(tok[fg], tok[bg])
              flag = 'ok  ' if r >= need else 'FAIL'
              print('  %s %-9s on %-8s %5.2f:1  (needs %.1f)  %s'
                    % (flag, '--' + fg, '--' + bg, r, need, what))
              if r < need:
                  print('::error::--%s on --%s is %.2f:1, below the %.1f:1 %s needs'
                        % (fg, bg, r, need, what))
                  bad = 1
          sys.exit(bad)
          EOF

      # A missing translation key does not fail a Jekyll build - it renders as
      # an empty string. The Romanian page would ship with a blank heading and
      # nothing anywhere would say so. The two tables must have the same shape,
      # and the built pages must be in the language they claim.
      #
      # PyYAML rather than a hand-rolled parser. The first version of this step
      # WAS hand-rolled, to avoid a dependency, and it disagreed with PyYAML on
      # 12 of 116 keys - it would have failed CI on two tables that are in fact
      # identical. A guard that cries wolf gets switched off.
      - name: The two languages stay in step
        run: |
          pip install --quiet pyyaml
          python3 - <<'EOF'
          import os, re, sys, yaml

          def shape(node, path=''):
              out = set()
              if isinstance(node, dict):
                  for k, v in node.items():
                      out |= shape(v, (path + '.' + str(k)).lstrip('.'))
              elif isinstance(node, list):
                  # Length matters: a list with a row missing is a section with
                  # a row missing, and it renders as a shorter list rather than
                  # as anything broken.
                  out.add('%s[%d]' % (path, len(node)))
              else:
                  out.add(path)
              return out

          def load(p):
              with open(p, encoding='utf-8') as f:
                  return shape(yaml.safe_load(f))

          en, ro = load('_data/i18n/en.yml'), load('_data/i18n/ro.yml')
          bad = 0
          for k in sorted(en - ro):
              print('::error::ro.yml is missing %s - it would render blank' % k)
              bad = 1
          for k in sorted(ro - en):
              print('::error::ro.yml has %s, which en.yml does not' % k)
              bad = 1
          if not bad:
              print('both tables define the same %d keys' % len(en))

          for path, lang in (('_site/index.html', 'en'), ('_site/ro/index.html', 'ro')):
              if not os.path.isfile(path):
                  print('::error::%s did not build' % path)
                  bad = 1
                  continue
              html = open(path, encoding='utf-8').read()
              m = re.search(r'<html lang="([^"]*)"', html)
              if not m or m.group(1) != lang:
                  print('::error::%s declares lang=%r, expected %r'
                        % (path, m and m.group(1), lang))
                  bad = 1

          # Words that cannot appear in Romanian prose. A hit is a section that
          # was never translated, not a stylistic quibble.
          if os.path.isfile('_site/ro/index.html'):
              body = open('_site/ro/index.html', encoding='utf-8').read()
              body = re.sub(r'<script.*?</script>', '', body, flags=re.S)
              body = re.sub(r'<style.*?</style>', '', body, flags=re.S)
              body = re.sub(r'<[^>]+>', ' ', body)
              for word in (' the ', ' and ', ' your ', 'Pricing', 'Questions',
                           'How it works', 'Not now'):
                  if word in body:
                      print('::error::the Romanian page still contains %r' % word)
                      bad = 1
          sys.exit(bad)
          EOF

      # The editorial ruleset, held against the BUILT articles. The rules were
      # written after the first draft broke most of them - no links in the
      # body, a source listed and never cited, a claim with nothing behind it -
      # and a rule nobody checks is a suggestion. These are the ones a machine
      # can actually check; the rest still need a person.
      - name: The articles keep their own rules
        run: |
          python3 - <<'EOF'
          import glob, os, re, sys

          bad = []
          posts = sorted(glob.glob('_site/blog/*/index.html'))
          if not posts:
              bad.append('no articles were built under _site/blog/')

          def text(html):
              html = re.sub(r'<(script|style|figure)\b.*?</\1>', ' ', html, flags=re.S)
              return re.sub(r'\s+', ' ', re.sub(r'<[^>]+>', ' ', html))

          for path in posts:
              name = path.split('/')[-2]
              html = open(path, encoding='utf-8').read()
              m = re.search(r'class="post__body">(.*?)(?:<p class="post__closing">|<section class="post__sources")', html, re.S)
              if not m:
                  bad.append('%s: no article body found' % name)
                  continue
              body = m.group(1)

              # A tag that did not render is invisible in review and obvious
              # on the page.
              for leak in ('{%', '{{', '{: .beat}'):
                  if leak in body:
                      bad.append('%s: %r reached the page unrendered' % (name, leak))

              words = len(re.findall(r"[A-Za-zÀ-ɏ'’]+", text(body)))
              if not 1200 <= words <= 1800:
                  bad.append('%s: body is %d words, outside 1200-1800' % (name, words))

              # "No source in the list that is not cited in the text."
              src = re.search(r'class="post__sources".*?</section>', html, re.S)
              listed = re.findall(r'href="(https?://[^"]+)"', src.group(0)) if src else []
              if not listed:
                  bad.append('%s: no sources listed' % name)
              for url in listed:
                  if ('href="%s"' % url) not in body:
                      bad.append('%s: %s is in the sources but never linked from the text' % (name, url))

              # "Clipa appears once, in the last line." The body may not name
              # it; the closing line must.
              if re.search(r'\bClipa\b', text(body)):
                  bad.append('%s: the body names Clipa - it belongs in the closing line only' % name)
              closing = re.search(r'<p class="post__closing">(.*?)</p>', html, re.S)
              if not closing or 'Clipa' not in closing.group(1):
                  bad.append('%s: no closing line naming Clipa' % name)

              # Every article carries at least one image, and it has a name.
              if not re.search(r'<figure class="post-figure">\s*<svg[^>]*role="img"', body):
                  bad.append('%s: no figure with an accessible name' % name)

              for href in re.findall(r'href="(/[^"#]*)"', body):
                  target = '_site' + href + ('index.html' if href.endswith('/') else '')
                  if not os.path.exists(target):
                      bad.append('%s: internal link %s goes nowhere' % (name, href))

              print('%-48s %4d words  %d sources' % (name, words, len(listed)))

          index = open('_site/blog/index.html', encoding='utf-8').read() if os.path.exists('_site/blog/index.html') else ''
          if index.count('class="blog__item"') != len(posts):
              bad.append('the blog index lists %d articles, %d were built'
                         % (index.count('class="blog__item"'), len(posts)))

          for b in bad:
              print('::error::%s' % b)
          sys.exit(1 if bad else 0)
          EOF

      - name: No content page may render an empty config value
        run: |
          fail=0
          for key in contact_email developer; do
            if grep -qE "^${key}: *\"\"" _config.yml; then
              hits=$(grep -rl "site\.${key}" --include="*.md" . || true)
              if [ -n "$hits" ]; then
                echo "::error::${key} is empty in _config.yml but used by: $hits"
                fail=1
              fi
            fi
          done
          if [ $fail -eq 0 ]; then echo "no page renders an empty config value"; fi
          exit $fail

      - name: A published legal page must be complete
        run: |
          if [ ! -f privacy.md ] && [ ! -f terms.md ]; then
            echo "holding page only - the legal documents are not published yet"
            exit 0
          fi
          fail=0
          for page in privacy terms delete-my-data; do
            if [ ! -f "_site/$page/index.html" ]; then
              echo "::error::$page did not render"; fail=1
            fi
          done
          # Empty here means the footer and the contact line render blank.
          if grep -qE '^(developer|contact_email): *""' _config.yml; then
            echo "::error::_config.yml still has an empty value while legal pages are published"
            fail=1
          fi
          exit $fail

      - name: Keep the built site for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site
          retention-days: 7
