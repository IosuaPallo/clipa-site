<!DOCTYPE html>
<html lang="{{ page.lang | default: 'en' }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title == site.title %}{{ site.title }}{% else %}{{ page.title }} · {{ site.title }}{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
{% if site.url %}<link rel="canonical" href="{{ page.url | absolute_url }}">{% endif %}
<link rel="preload" href="{{ '/assets/fonts/literata-latin.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{{ '/assets/fonts/ibm-plex-sans-latin.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
</head>
<body>

<!--
  Full-bleed shell. The landing page is a designed composition of alternating
  bands, so unlike the legal pages it must NOT be poured into a fixed measure -
  each section owns its own background and sets its own width.
-->
<header class="masthead frame">
  <a class="brand" href="{{ '/' | relative_url }}">
    <span class="mark" aria-hidden="true"></span>
    <span class="mark-name">Clipa</span>
  </a>
  <nav aria-label="Site">
    <a href="{{ '/privacy/' | relative_url }}">Privacy</a>
    <a href="{{ '/terms/' | relative_url }}">Terms</a>
    <a href="{{ '/support/' | relative_url }}">Support</a>
  </nav>
</header>

<main>
  {{ content }}
</main>

<footer class="site-footer frame">
  <nav aria-label="Footer">
    <a href="{{ '/' | relative_url }}">Home</a>
    <a href="{{ '/privacy/' | relative_url }}">Privacy</a>
    <a href="{{ '/terms/' | relative_url }}">Terms</a>
    <a href="{{ '/delete-my-data/' | relative_url }}">Delete my data</a>
    <a href="{{ '/support/' | relative_url }}">Support</a>
  </nav>
  {% if site.developer %}<p>{{ site.developer }}</p>{% endif %}
</footer>

<script src="{{ '/assets/site.js' | relative_url }}" defer></script>
</body>
</html>
