<!DOCTYPE html>
<html lang="{{ page.lang | default: 'en' }}">
<head>
{% include head.html %}
</head>
<body>

{% include masthead.html %}

<main class="frame">
  <div class="prose">
    {{ content }}
  </div>
</main>

<footer class="site-footer frame">
  <nav aria-label="Footer">
    <a href="{{ '/' | relative_url }}">Home</a>
    <a href="{{ '/privacy/' | relative_url }}">Privacy</a>
    <a href="{{ '/terms/' | relative_url }}">Terms</a>
    <a href="{{ '/delete-my-data/' | relative_url }}">Delete my data</a>
    <a href="{{ '/support/' | relative_url }}">Support</a>
  </nav>
  {% if site.developer %}<p>{{ site.developer }}</p>{% endif %}
</footer>

<script>
// Markdown tables get a scroll container so a wide table cannot make the whole
// page scroll sideways on a phone. Progressive enhancement: without JS the
// table simply renders, which is correct if not ideal.
document.querySelectorAll('table').forEach(function (t) {
  var box = document.createElement('div');
  box.className = 'table-scroll';
  t.parentNode.insertBefore(box, t);
  box.appendChild(t);
});
</script>
<script src="{{ '/assets/site.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
</body>
</html>
