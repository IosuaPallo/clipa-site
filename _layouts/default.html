<!DOCTYPE html>
<html lang="{{ page.lang | default: 'en' }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title == site.title %}{{ site.title }}{% else %}{{ page.title }} · {{ site.title }}{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600&display=swap" rel="stylesheet">
<style>
/*
  The palette is the app's, token for token — see ui/theme/Color.kt.
  A privacy policy that looks like a different product than the app is a small
  broken promise, and this is the one page where trust is the whole point.
*/
:root {
  --bg: #EFF1EC;          /* sage100  */
  --surface: #F7F8F4;     /* sage50   */
  --text: #16201A;        /* inkBlack */
  --text-2: #4F5A52;      /* slate700 */
  --text-3: #6E786F;      /* slate600 */
  --accent: #2F5F4B;      /* green700 */
  --outline: #CDD4C6;     /* sage300  */
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0C0F0D;        /* ink950 */
    --surface: #141814;   /* ink900 */
    --text: #E8ECE6;      /* ink050 */
    --text-2: #9AA69C;    /* ink200 */
    --text-3: #6B766D;    /* ink300 */
    --accent: #86BFA3;    /* green400 */
    --outline: #2A322B;   /* ink700 */
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: 17px;
  line-height: 1.65;
}
.wrap { max-width: 42rem; margin: 0 auto; padding: 3rem 1.5rem 6rem; }

header.masthead { display: flex; align-items: center; gap: .75rem; margin-bottom: 3rem; }
/* The icon's own idea: a solid field interrupted once. */
.mark { width: 34px; height: 34px; border-radius: 9px; background: var(--accent); position: relative; flex: none; }
.mark::after { content: ""; position: absolute; left: 18%; right: 18%; top: 50%; height: 1.5px; background: var(--bg); transform: translateY(-50%); }
.mark-name { font-family: Literata, Georgia, serif; font-size: 1.25rem; color: var(--text); text-decoration: none; }

h1, h2, h3 { font-family: Literata, Georgia, serif; font-weight: 600; line-height: 1.25; }
h1 { font-size: 2rem; margin: 0 0 .5rem; letter-spacing: -0.01em; }
h2 { font-size: 1.3rem; margin: 3rem 0 .75rem; }
h3 { font-size: 1.05rem; margin: 2rem 0 .5rem; }
p, li { color: var(--text-2); }
strong { color: var(--text); font-weight: 600; }
a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 2px; }
ul { padding-left: 1.25rem; }
li { margin: .35rem 0; }
hr { border: 0; border-top: 1px solid var(--outline); margin: 3rem 0; }
code { font-size: .9em; background: var(--surface); padding: .1em .35em; border-radius: 4px; }

/* Tables scroll rather than pushing the page sideways on a phone. */
.table-scroll { overflow-x: auto; margin: 1rem 0; }
table { border-collapse: collapse; width: 100%; font-size: .95rem; }
th, td { text-align: left; padding: .6rem .75rem; border-bottom: 1px solid var(--outline); color: var(--text-2); }
th { color: var(--text); font-weight: 600; }

blockquote { margin: 1.5rem 0; padding: .75rem 1.25rem; border-left: 2px solid var(--accent); background: var(--surface); border-radius: 0 8px 8px 0; }
blockquote p { margin: .35rem 0; }

.updated { color: var(--text-3); font-size: .9rem; margin-bottom: 2.5rem; }

footer { margin-top: 5rem; padding-top: 1.5rem; border-top: 1px solid var(--outline); color: var(--text-3); font-size: .9rem; }
footer a { color: var(--text-3); }
footer nav { display: flex; flex-wrap: wrap; gap: 1.25rem; margin-bottom: .75rem; }
</style>
</head>
<body>
<div class="wrap">

  <header class="masthead">
    <div class="mark" aria-hidden="true"></div>
    <a class="mark-name" href="{{ '/' | relative_url }}">Clipa</a>
  </header>

  <main>
    {{ content }}
  </main>

  <footer>
    <nav>
      <a href="{{ '/' | relative_url }}">Home</a>
      <a href="{{ '/privacy/' | relative_url }}">Privacy</a>
      <a href="{{ '/terms/' | relative_url }}">Terms</a>
      <a href="{{ '/delete-my-data/' | relative_url }}">Delete my data</a>
    </nav>
    <p>{{ site.developer }}</p>
  </footer>

</div>
<script>
// Markdown tables get a scroll container so a wide table cannot make the whole
// page scroll sideways on a phone.
document.querySelectorAll('table').forEach(function (t) {
  var box = document.createElement('div');
  box.className = 'table-scroll';
  t.parentNode.insertBefore(box, t);
  box.appendChild(t);
});
</script>
</body>
</html>
