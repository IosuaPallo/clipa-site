{%- assign lang = page.lang | default: 'en' -%}
{%- assign t = site.data.i18n[lang] -%}

<section class="section" id="cta">
  <div class="frame">
    <div class="cta">
      <h2 class="cta__title">{{ t.cta.title }}</h2>
      <p class="cta__body">{{ t.cta.body }}</p>
      <p class="cta__action">
        <a class="btn cta__btn"
           href="mailto:{{ site.contact_email }}?subject={{ t.cta.subject | url_encode }}">
          {{ t.cta.button }}
        </a>
      </p>
      <p class="cta__note">{{ t.cta.note }}</p>
    </div>
  </div>
</section>
