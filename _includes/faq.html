{%- assign t = site.data.i18n[page.lang | default: 'en'] -%}

<section class="section section--surface" id="faq">
  <div class="frame faq">
    <div class="faq__head">
      <p class="eyebrow">{{ t.faq.eyebrow }}</p>
      <h2 class="section__title">{{ t.faq.title }}</h2>
      <p>{{ t.faq.intro_before }}<a href="mailto:{{ site.contact_email }}">{{ t.faq.intro_link }}</a>{{ t.faq.intro_after }}</p>
    </div>

    <div class="faq__list">
      {%- for item in t.faq.items -%}
        <details class="faq__item"{% if forloop.first %} open{% endif %}>
          <summary class="faq__q">{{ item.q }} <svg class="faq__chev" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></summary>
          <div class="faq__panel"><div><p>{{ item.a }}</p></div></div>
        </details>
      {%- endfor -%}
    </div>
  </div>
</section>
